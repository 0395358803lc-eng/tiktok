[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "th-tiktok-manager-backend"
version = "0.2.0"
description = "TH TikTok Manager backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<8",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "cryptography>=45,<47"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
